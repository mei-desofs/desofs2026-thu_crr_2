name: Backend Integration Tests

on:
  push:
    branches: [add-pipelines]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests with MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: desofs_test
          MYSQL_USER: desofs
          MYSQL_PASSWORD: desofs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: desofs_test
          DB_USER: desofs
          DB_PASS: desofs
          JWT_SECRET: test_secret
          SECRET_KEY: test_secret
