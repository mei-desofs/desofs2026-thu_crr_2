name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerable dependencies
        run: npm audit --audit-level=high

      - name: Generate reports
        run: npm audit --json || true


  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-review, npm-audit]
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript Configuration
        run: npx tsc --noEmit

      - name: Build TypeScript
        run: npm run build

      - name: Generate SBOM (Component Inventory)
        uses: anchore/sbom-action@v0
        with:
          path: Backend/
          format: spdx-json
          output-file: Backend/sbom.spdx.json

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret
          SECRET_KEY: test_secret

      - name: Upload coverage report and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-inventory
          path: |
            Backend/coverage/
            Backend/sbom.spdx.json

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  sast:
    name: SAST (NodeJsScan)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NodeJsScan
        uses: ajinabraham/njsscan-action@master
        with:
          args: '--sarif --output nodejsscan.sarif Backend/src || true'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: nodejsscan.sarif

      - name: Upload raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejsscan-report
          path: nodejsscan.sarif

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build-and-test]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: desofs_test
          MYSQL_USER: desofs
          MYSQL_PASSWORD: desofs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: desofs_test
          DB_USER: desofs
          DB_PASS: desofs
          JWT_SECRET: test_secret
          SECRET_KEY: test_secret

  dast:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: [integration-tests]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: desofs_test
          MYSQL_USER: desofs
          MYSQL_PASSWORD: desofs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Build TypeScript
        run: npm run build
        working-directory: Backend

      - name: Start backend server
        run: node dist/index.js &
        working-directory: Backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: desofs_test
          DB_USER: desofs
          DB_PASS: desofs
          JWT_SECRET: test_secret
          SECRET_KEY: test_secret

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json